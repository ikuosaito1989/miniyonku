<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レース効果音 比較</title><style>body{font:16px system-ui;background:#142b3b;color:#f3f4e6;max-width:680px;margin:40px auto;padding:0 20px}button,input{font:inherit}button{padding:12px;margin:4px;background:#d7e4d7;color:#17364a;border:0;border-radius:4px}label{display:block;margin:20px 0}input{width:100%}small{line-height:1.6}</style></head><body><h1>レース効果音の聴き比べ</h1><p>ボタンを押すと発進し、速度スライダーで走行音を比較します。</p><button id="before">変更前</button><button id="after">変更後</button><button id="stop">停止</button><p>カウントダウンとGO：</p><button id="count-before">変更前</button><button id="count-after">変更後</button><label>速度 <output id="speed-value">5</output><input id="speed" type="range" min="0" max="10" value="5" step="0.1"></label><p id="status" role="status">待機中</p><small>変更後は実録音の読み込み完了まで変更前の音が再生されます。音量に注意し、徐々に上げてください。開発用画面です。</small><script type="module" src="/src/soundLab.ts"></script></body></html>
